name: TestTag CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  SOLUTION_PATH: ./TestTag.sln
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: Debug

jobs:
  CIBuild:
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET (with NuGet cache)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: 📦 Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: 🔨 Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: 🧪 Test
        run: dotnet test ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test.trx" --results-directory TestResults --settings Coverlet.runsettings --collect:"XPlat Code Coverage"

      - name: 🧪 Publish test results to Checks
        if: ${{ always() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: TestResults/**/*.trx
          check_name: "Tests"

      - name: 📈 Generate coverage summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -e
          coverageFile=$(find TestResults -name 'coverage.cobertura.xml' -type f | head -n 1)
          if [ -n "$coverageFile" ] && [ -f "$coverageFile" ]; then
            lineRate=$(grep -oP 'line-rate="\K[^"]+' "$coverageFile" | head -n 1)
            branchRate=$(grep -oP 'branch-rate="\K[^"]+' "$coverageFile" | head -n 1)
            linePercent=$(awk "BEGIN {printf \"%.2f\", $lineRate * 100}")
            branchPercent=$(awk "BEGIN {printf \"%.2f\", $branchRate * 100}")
            
            echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Line Coverage** | **${linePercent}%** |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branch Coverage** | **${branchPercent}%** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### Coverage by Class" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Class | Line Coverage | Branch Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|---------------|-----------------|" >> $GITHUB_STEP_SUMMARY
            
            grep '<class' "$coverageFile" | while IFS= read -r line; do
              className=$(echo "$line" | grep -oP 'name="\K[^"]+' || echo "Unknown")
              classLine=$(echo "$line" | grep -oP 'line-rate="\K[^"]+' || echo "0")
              classBranch=$(echo "$line" | grep -oP 'branch-rate="\K[^"]+' || echo "0")
              classLinePercent=$(awk "BEGIN {printf \"%.2f\", $classLine * 100}")
              classBranchPercent=$(awk "BEGIN {printf \"%.2f\", $classBranch * 100}")
              echo "| $className | ${classLinePercent}% | ${classBranchPercent}% |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No coverage file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
