name: TestTag CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  SOLUTION_PATH: ./TestTag.sln
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: Debug

jobs:
  CIBuild:
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET (with NuGet cache)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: 📦 Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: 🔨 Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: 🧪 Test
        run: dotnet test ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test.trx" --results-directory TestResults --settings Coverlet.runsettings --collect:"XPlat Code Coverage"

      - name: 🧪 Publish test results to Checks
        if: ${{ always() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: TestResults/**/*.trx
          check_name: "Tests"

      - name: 📈 Generate coverage summary
        if: ${{ always() }}
        run: |
          $coverageFile = Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if ($coverageFile) {
            [xml]$coverage = Get-Content $coverageFile.FullName
            $lineRate = [math]::Round([decimal]$coverage.coverage.'line-rate' * 100, 2)
            $branchRate = [math]::Round([decimal]$coverage.coverage.'branch-rate' * 100, 2)
            
            "## Test Coverage Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "| Metric | Coverage |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "|--------|----------|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "| **Line Coverage** | **${lineRate}%** |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "| **Branch Coverage** | **${branchRate}%** |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            
            "### Coverage by Class" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "| Class | Line Coverage | Branch Coverage |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "|-------|---------------|-----------------|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            
            foreach ($package in $coverage.coverage.packages.package) {
              foreach ($class in $package.classes.class) {
                $className = $class.name
                $classLineRate = [math]::Round([decimal]$class.'line-rate' * 100, 2)
                $classBranchRate = [math]::Round([decimal]$class.'branch-rate' * 100, 2)
                "| $className | ${classLineRate}% | ${classBranchRate}% |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
            }
          }

      - name: 💾 Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
