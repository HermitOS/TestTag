name: 'Simple Code Coverage Report'
description: 'Generate a color-coded coverage report from Cobertura XML files with class and method level details'
author: 'Terje Sandstrom'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  coverage-file-pattern:
    description: 'Pattern to find coverage XML files'
    required: false
    default: 'TestResults/**/coverage.cobertura.xml'
  cov-green-threshold:
    description: 'Coverage percentage threshold for green status'
    required: false
    default: '50'
  cov-yellow-threshold:
    description: 'Coverage percentage threshold for yellow status'
    required: false
    default: '20'
  complexity-green-threshold:
    description: 'Complexity threshold for green status'
    required: false
    default: '10'
  complexity-yellow-threshold:
    description: 'Complexity threshold for yellow status'
    required: false
    default: '20'
  crap-class-green-max:
    description: 'Class-level CRAP at or below this value is green (default 30)'
    required: false
    default: '30'
  crap-class-yellow-max:
    description: 'Class-level CRAP above green max and at or below this value is yellow (default 60)'
    required: false
    default: '60'
  crap-method-green-max:
    description: 'Method-level CRAP at or below this value is green (default 5)'
    required: false
    default: '5'
  crap-method-yellow-max:
    description: 'Method-level CRAP above green max and at or below this value is yellow (default 12)'
    required: false
    default: '12'
runs:
  using: 'composite'
  steps:
    - name: Generate coverage summary
      shell: bash
      run: ${{ github.action_path }}/generate-coverage.sh
      env:
        COVERAGE_FILE_PATTERN: ${{ inputs.coverage-file-pattern }}
        COV_GREEN: ${{ inputs.cov-green-threshold }}
        COV_YELLOW: ${{ inputs.cov-yellow-threshold }}
        COMPLEX_GREEN: ${{ inputs.complexity-green-threshold }}
        COMPLEX_YELLOW: ${{ inputs.complexity-yellow-threshold }}
        CRAP_CLASS_GREEN_MAX: ${{ inputs.crap-class-green-max }}
        CRAP_CLASS_YELLOW_MAX: ${{ inputs.crap-class-yellow-max }}
        CRAP_METHOD_GREEN_MAX: ${{ inputs.crap-method-green-max }}
        CRAP_METHOD_YELLOW_MAX: ${{ inputs.crap-method-yellow-max }}
