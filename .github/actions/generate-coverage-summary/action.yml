name: 'Generate Coverage Summary'
description: 'Generates a coverage summary from Cobertura XML files with color-coded indicators'
inputs:
  coverage-file-pattern:
    description: 'Pattern to match coverage files'
    required: false
    default: 'TestResults/**/coverage.cobertura.xml'
  coverage-green-threshold:
    description: 'Coverage percentage threshold for green indicator'
    required: false
    default: '50'
  coverage-yellow-threshold:
    description: 'Coverage percentage threshold for yellow indicator'
    required: false
    default: '20'
  complexity-green-threshold:
    description: 'Complexity threshold for green indicator'
    required: false
    default: '10'
  complexity-yellow-threshold:
    description: 'Complexity threshold for yellow indicator'
    required: false
    default: '20'
outputs:
  coverage-summary:
    description: 'Generated coverage summary in markdown format'
    value: ${{ steps.generate-summary.outputs.summary }}
runs:
  using: 'composite'
  steps:
    - name: Generate Coverage Summary
      id: generate-summary
      shell: bash
      run: |
        # Function to get color indicator based on thresholds
        get_indicator() {
          local value=$1
          local green_threshold=$2
          local yellow_threshold=$3
          
          if (( $(echo "$value >= $green_threshold" | bc -l) )); then
            echo "🟢"
          elif (( $(echo "$value >= $yellow_threshold" | bc -l) )); then
            echo "🟡"
          else
            echo "🔴"
          fi
        }
        
        # Find coverage files
        coverage_files=$(find . -path "${{ inputs.coverage-file-pattern }}" 2>/dev/null)
        
        if [ -z "$coverage_files" ]; then
          echo "No coverage files found matching pattern: ${{ inputs.coverage-file-pattern }}"
          echo "summary=No coverage files found" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Initialize summary
        summary_file=$(mktemp)
        echo "## 📊 Code Coverage Summary" > "$summary_file"
        echo "" >> "$summary_file"
        
        # Process each coverage file
        for coverage_file in $coverage_files; do
          echo "Processing: $coverage_file"
          
          if [ ! -f "$coverage_file" ]; then
            continue
          fi
          
          # Extract overall coverage metrics
          line_rate=$(xmllint --xpath "string(/coverage/@line-rate)" "$coverage_file" 2>/dev/null || echo "0")
          branch_rate=$(xmllint --xpath "string(/coverage/@branch-rate)" "$coverage_file" 2>/dev/null || echo "0")
          
          # Convert to percentages
          line_coverage=$(echo "$line_rate * 100" | bc -l | xargs printf "%.2f")
          branch_coverage=$(echo "$branch_rate * 100" | bc -l | xargs printf "%.2f")
          
          # Get overall metrics
          lines_covered=$(xmllint --xpath "string(/coverage/@lines-covered)" "$coverage_file" 2>/dev/null || echo "0")
          lines_valid=$(xmllint --xpath "string(/coverage/@lines-valid)" "$coverage_file" 2>/dev/null || echo "0")
          branches_covered=$(xmllint --xpath "string(/coverage/@branches-covered)" "$coverage_file" 2>/dev/null || echo "0")
          branches_valid=$(xmllint --xpath "string(/coverage/@branches-valid)" "$coverage_file" 2>/dev/null || echo "0")
          
          # Add overall metrics
          echo "### Overall Coverage" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "| Metric | Coverage | Covered | Total |" >> "$summary_file"
          echo "|--------|----------|---------|-------|" >> "$summary_file"
          
          line_indicator=$(get_indicator "$line_coverage" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
          branch_indicator=$(get_indicator "$branch_coverage" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
          
          echo "| Line Coverage | $line_indicator ${line_coverage}% | $lines_covered | $lines_valid |" >> "$summary_file"
          echo "| Branch Coverage | $branch_indicator ${branch_coverage}% | $branches_covered | $branches_valid |" >> "$summary_file"
          echo "" >> "$summary_file"
          
          # Extract and process class-level coverage
          echo "### Coverage by Class" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "| Class | Line Coverage | Branch Coverage | Complexity |" >> "$summary_file"
          echo "|-------|---------------|-----------------|------------|" >> "$summary_file"
          
          # Parse XML for class information
          classes=$(xmllint --xpath "//class" "$coverage_file" 2>/dev/null | grep -o 'filename="[^"]*"' | cut -d'"' -f2 || echo "")
          
          if [ -n "$classes" ]; then
            class_count=0
            while IFS= read -r class_filename; do
              [ -z "$class_filename" ] && continue
              
              # Get class metrics
              class_line_rate=$(xmllint --xpath "string(//class[@filename='$class_filename']/@line-rate)" "$coverage_file" 2>/dev/null || echo "0")
              class_branch_rate=$(xmllint --xpath "string(//class[@filename='$class_filename']/@branch-rate)" "$coverage_file" 2>/dev/null || echo "0")
              class_complexity=$(xmllint --xpath "string(//class[@filename='$class_filename']/@complexity)" "$coverage_file" 2>/dev/null || echo "0")
              
              class_line_pct=$(echo "$class_line_rate * 100" | bc -l | xargs printf "%.2f")
              class_branch_pct=$(echo "$class_branch_rate * 100" | bc -l | xargs printf "%.2f")
              
              line_ind=$(get_indicator "$class_line_pct" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
              branch_ind=$(get_indicator "$class_branch_pct" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
              
              # Complexity indicator (lower is better, so thresholds are inverted)
              if (( $(echo "$class_complexity <= ${{ inputs.complexity-green-threshold }}" | bc -l) )); then
                complex_ind="🟢"
              elif (( $(echo "$class_complexity <= ${{ inputs.complexity-yellow-threshold }}" | bc -l) )); then
                complex_ind="🟡"
              else
                complex_ind="🔴"
              fi
              
              class_name=$(basename "$class_filename")
              echo "| \`$class_name\` | $line_ind ${class_line_pct}% | $branch_ind ${class_branch_pct}% | $complex_ind $class_complexity |" >> "$summary_file"
              
              class_count=$((class_count + 1))
              [ $class_count -ge 20 ] && break
            done <<< "$classes"
          else
            echo "| No class data available | - | - | - |" >> "$summary_file"
          fi
          
          echo "" >> "$summary_file"
          
          # Extract and process method-level coverage (top methods with low coverage)
          echo "### Methods Needing Attention (Low Coverage)" >> "$summary_file"
          echo "" >> "$summary_file"
          echo "| Method | Class | Line Coverage | Branch Coverage |" >> "$summary_file"
          echo "|--------|-------|---------------|-----------------|" >> "$summary_file"
          
          # Note: Cobertura XML structure varies, this is a simplified approach
          # In practice, you might need to adjust based on your specific XML structure
          method_count=0
          xmllint --xpath "//method" "$coverage_file" 2>/dev/null | \
            grep -oP '(name="[^"]*"|line-rate="[^"]*"|branch-rate="[^"]*")' | \
            paste -d' ' - - - 2>/dev/null | \
            while read -r line; do
              method_name=$(echo "$line" | grep -oP 'name="\K[^"]*' || echo "unknown")
              method_line_rate=$(echo "$line" | grep -oP 'line-rate="\K[^"]*' || echo "0")
              method_branch_rate=$(echo "$line" | grep -oP 'branch-rate="\K[^"]*' || echo "0")
              
              method_line_pct=$(echo "$method_line_rate * 100" | bc -l | xargs printf "%.2f" 2>/dev/null || echo "0.00")
              method_branch_pct=$(echo "$method_branch_rate * 100" | bc -l | xargs printf "%.2f" 2>/dev/null || echo "0.00")
              
              # Only show methods with less than green threshold coverage
              if (( $(echo "$method_line_pct < ${{ inputs.coverage-green-threshold }}" | bc -l 2>/dev/null || echo 0) )); then
                line_ind=$(get_indicator "$method_line_pct" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
                branch_ind=$(get_indicator "$method_branch_pct" "${{ inputs.coverage-green-threshold }}" "${{ inputs.coverage-yellow-threshold }}")
                
                echo "| \`$method_name\` | - | $line_ind ${method_line_pct}% | $branch_ind ${method_branch_pct}% |" >> "$summary_file"
                
                method_count=$((method_count + 1))
                [ $method_count -ge 10 ] && break
              fi
            done
          
          if [ $method_count -eq 0 ]; then
            echo "| All methods meet coverage thresholds! ✨ | - | - | - |" >> "$summary_file"
          fi
          
          echo "" >> "$summary_file"
        done
        
        # Add legend
        echo "---" >> "$summary_file"
        echo "" >> "$summary_file"
        echo "**Legend:** 🟢 Good | 🟡 Fair | 🔴 Needs Improvement" >> "$summary_file"
        echo "" >> "$summary_file"
        echo "**Thresholds:**" >> "$summary_file"
        echo "- Coverage: 🟢 ≥${{ inputs.coverage-green-threshold }}% | 🟡 ≥${{ inputs.coverage-yellow-threshold }}% | 🔴 <${{ inputs.coverage-yellow-threshold }}%" >> "$summary_file"
        echo "- Complexity: 🟢 ≤${{ inputs.complexity-green-threshold }} | 🟡 ≤${{ inputs.complexity-yellow-threshold }} | 🔴 >${{ inputs.complexity-yellow-threshold }}" >> "$summary_file"
        
        # Output summary
        summary_content=$(cat "$summary_file")
        echo "$summary_content"
        
        # Set output (escape for GitHub Actions)
        {
          echo "summary<<EOF"
          cat "$summary_file"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        
        # Clean up
        rm -f "$summary_file"
